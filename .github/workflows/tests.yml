# CI Raw Adventure — filet de sécurité hors machine.
# À chaque push/PR sur main : TypeScript + suite Jest, puis salve E2E Playwright.
# Coche verte / croix rouge visible sur chaque commit dans GitHub.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: TypeScript + Jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Jest
        run: npx jest --ci

  e2e:
    name: E2E Playwright (PWA)
    runs-on: ubuntu-latest
    needs: unit
    env:
      # L'app exige ces variables au boot (src/lib/supabase.ts). Les parcours
      # E2E anonymes n'appellent jamais Supabase — valeurs factices suffisantes
      # si les secrets ne sont pas configurés.
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://ci-dummy.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'ci-dummy-anon-key' }}
      # Compte de test dédié (créé 2 sept 2026) — parcours hub connecté.
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Installer Chromium Playwright
        run: npx playwright install --with-deps chromium
      - name: Salve E2E
        run: npx playwright test
      - name: Artefacts d'échec (traces + captures)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
