# Jekyll config — site légal Raw Adventure (rawadventure.world)
# GitHub Pages déploie automatiquement depuis ce dossier.

title: Raw Adventure — Documents légaux
description: Conditions générales, politique de confidentialité et mentions légales de Raw Adventure Limited.
url: "https://rawadventure.world"
lang: fr

# Pas de plugins externes (compatibilité GitHub Pages strict)
markdown: kramdown
highlighter: rouge
permalink: /:title/

# Exclude raw .md drafts originaux (uniquement les versions formatées du site)
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock

# Force Jekyll à inclure le dossier .well-known (sinon ignoré par défaut car
# préfixé d'un point). Contient apple-app-site-association (Universal Links iOS)
# et assetlinks.json (App Links Android).
include:
  - .well-known
  - .well-known/apple-app-site-association
  - .well-known/assetlinks.json

# Force MIME type application/json pour AASA (Apple exige).
# GitHub Pages sert correctement via Content-Type auto, mais on documente.

# Defaults — applique layout `default` à toutes les pages
defaults:
  - scope:
      path: ""
    values:
      layout: default
