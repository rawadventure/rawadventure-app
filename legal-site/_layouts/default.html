<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }} — Raw Adventure</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a href="{{ '/' | relative_url }}" class="brand">Raw Adventure</a>
  </header>

  <main class="content">
    {% if page.show_title != false %}
      <h1>{{ page.title }}</h1>
      {% if page.subtitle %}<p class="subtitle">{{ page.subtitle }}</p>{% endif %}
    {% endif %}

    {{ content }}
  </main>

  <footer class="site-footer">
    <nav class="footer-nav">
      <a href="{{ '/cgu/' | relative_url }}">CGU</a>
      <a href="{{ '/politique-confidentialite/' | relative_url }}">Politique de confidentialité</a>
      <a href="{{ '/mentions-legales/' | relative_url }}">Mentions légales</a>
    </nav>
    <p class="footer-meta">
      © Raw Adventure Limited — Hong Kong<br>
      Contact : <a href="mailto:support@rawadventure.world">support@rawadventure.world</a>
    </p>
  </footer>
</body>
</html>
